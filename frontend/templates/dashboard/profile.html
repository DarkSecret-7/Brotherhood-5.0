<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Dashboard</title>
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/icon.png" />
    <link rel="stylesheet" href="/frontend/css/common.css">
    <link rel="stylesheet" href="/frontend/css/dashboard_styles.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div style="display: flex; align-items: center;">
                <div class="hamburger-menu">
                    <button class="hamburger-btn" onclick="openSidePanel()">☰</button>
                </div>
                <div style="margin-left: 30px;">
                    <h1 style="margin: 0;">My Profile</h1>
                    <div class="version-indicator">Dashboard</div>
                </div>
            </div>
        </div>

        <main class="dashboard-main">

            <div id="profile-container">
                <!-- Profile content will be rendered by UI controller -->
                <div class="card">
                    <p>Loading profile...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Side Panel -->
    <div id="side-panel-overlay" class="side-panel-overlay"></div>
    <div id="side-panel" class="side-panel">
        <button class="side-panel-close" onclick="closeSidePanel()">&times;</button>
        <a href="/dashboard/profile" class="side-panel-link">Profile</a>
        <a href="/dashboard/proposals" class="side-panel-link">Proposals</a>
        <hr class="side-panel-break">        
        <a href="/academia" class="side-panel-link-outer">Academia <span>↗</span></a>
        <a href="/lab" class="side-panel-link-outer">Curator Lab <span>↗</span></a>
        <a href="/landing" class="side-panel-link-outer">Home <span>↗</span></a>
        <a href="#" onclick="logout()" class="side-panel-link-outer" style="color: #d93025;">Logout</a>
    </div>

    <!-- Custom Dialog Modal -->
    <div id="custom-dialog-overlay" class="dialog-overlay" style="display: none;">
        <div id="custom-dialog" class="dialog-modal">
            <div id="dialog-title" class="dialog-title"></div>
            <div id="dialog-message" class="dialog-message"></div>
            <div class="dialog-buttons">
                <button id="dialog-cancel" class="btn btn-outline dialog-btn-cancel">Cancel</button>
                <button id="dialog-confirm" class="btn btn-primary dialog-btn-confirm">OK</button>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="password-modal-overlay" class="dialog-overlay" style="display: none;">
        <div id="password-modal" class="dialog-content">
            <div class="dialog-header">
                <h3>Change Password</h3>
                <button class="dialog-close" onclick="profileController.closePasswordModal()">&times;</button>
            </div>
            <div class="dialog-body">
                <form id="password-form" onsubmit="event.preventDefault(); profileController.changePassword()">
                    <div class="form-group">
                        <label for="old-password">Current Password</label>
                        <input type="password" id="old-password" name="oldPassword" required placeholder="Enter your current password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="newPassword" required placeholder="Create a new password">
                        <div class="password-requirements">
                            Password must be at least 8 characters long
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" name="confirmPassword" required placeholder="Confirm your new password">
                    </div>
                    <div id="password-error" class="password-error-message"></div>
                </form>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn btn-outline" onclick="profileController.closePasswordModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="profileController.changePassword()">Change Password</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-copy">© 2026 The Brotherhood Project Developers. Released under <a href="https://www.gnu.org/licenses/gpl-3.0" target="_blank">GNU GPL v3.0</a>.</div>

    </footer>

    <!-- Scripts -->
    <script src="/frontend/api/base-api-service.js"></script>
    <script src="/frontend/api/auth/auth-api-service.js"></script>
    <script src="/frontend/api/users/users-api-service.js"></script>
    <script src="/frontend/transformer/auth/auth-transformer.js"></script>
    <script src="/frontend/state/dashboard-state-manager.js"></script>
    <script src="/frontend/ui/nav/nav-controller.js"></script>
    <script src="/frontend/ui/dashboard/profile-controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!authApiService.isAuthenticated()) {
                window.location.href = '/auth/login';
                return;
            }

            window.dashboardStateManager = new DashboardStateManager();

            // Architecture: Controller → Transformer → API → State
            window.profileController = new ProfileController(dashboardStateManager, authTransformer);

            // Subscribe controller's dialog renderer to state changes
            dashboardStateManager.subscribe(profileController.renderDialog.bind(profileController));

            await profileController.init();
        });
    </script>
</body>
</html>
