<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Library - Dashboard</title>
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/icon.png" />
    <link rel="stylesheet" href="/frontend/css/dashboard_styles.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div style="display: flex; align-items: center;">
                <div class="hamburger-menu">
                    <button class="hamburger-btn" onclick="openSidePanel()">☰</button>
                </div>
                <div style="margin-left: 30px;">
                    <h1 style="margin: 0;">Graph Library</h1>
                    <div class="version-indicator">Dashboard</div>
                </div>
            </div>
        </div>

        <main class="dashboard-main">

            <div class="tabs">
                <button class="btn tab-btn active" onclick="libraryController.switchTab('bookmarks')">My Bookmarks</button>
                <button class="btn tab-btn" onclick="libraryController.switchTab('browse')">Browse Public Graphs</button>
            </div>

            <!-- Bookmarks Section (default view) -->
            <div id="bookmarks-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 10px 0;"></h2>       <!-- Placeholder for now -->
                    <button class="btn btn-outline" onclick="libraryController.refreshBookmarks()" title="Refresh bookmarks">
                        🔄 Refresh
                    </button>
                </div>
                <div id="library-content">
                    <div class="card">
                        <p>Loading library...</p>
                    </div>
                </div>
            </div>

            <!-- Browse Section (hidden by default) -->
            <div id="browse-section" style="display: none;">
                <div id="browse-content">
                    <div class="card">
                        <p>Loading public graphs...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Graph Preview Modal -->
    <div id="preview-modal-overlay" class="preview-modal-overlay">
        <div class="preview-modal-container">
            <div class="preview-modal-header">
                <h2 class="preview-modal-title">Preview Window</h2>
            </div>
            <button class="preview-close-btn" onclick="dashboardStateManager.closePreviewModal()">&times;</button>
            <div id="preview-meta-panel" class="preview-meta-panel">
                <h2 id="preview-graph-name" class="preview-graph-name"></h2>
                <p id="preview-graph-uuid" class="preview-graph-uuid"></p>
                <div class="preview-modal-actions">
                    <button id="preview-bookmark-btn" class="btn btn-primary btn-sm">Bookmark</button>
                    <button id="preview-assess-btn" class="btn btn-success btn-sm" style="display: none;">Assess</button>
                </div>
            </div>
            <div id="preview-graph-container" class="preview-graph-container"></div>
            <div id="preview-details-panel" class="preview-details-panel">
                <h3 id="preview-detail-title"></h3>
                <p id="preview-detail-desc"></p>
            </div>
            <div id="preview-loading" class="preview-loading">Loading graph...</div>
        </div>
    </div>

    <!-- Side Panel -->
    <div id="side-panel-overlay" class="side-panel-overlay"></div>
    <div id="side-panel" class="side-panel">
        <button class="side-panel-close" onclick="closeSidePanel()">&times;</button>
        <a href="/dashboard/profile" class="side-panel-link">Profile</a>
        <a href="/dashboard/library" class="side-panel-link active">Library</a>
        <a href="/dashboard/assessment" class="side-panel-link">Self-Assessment</a>
        <a href="/lab/workspace" class="side-panel-link">Workspace</a>
        <a href="/landing" class="side-panel-link">Home</a>
        <a href="#" onclick="logout()" class="side-panel-link" style="color: #d93025;">Logout</a>
    </div>

    <!-- Scripts -->
    <script src="/frontend/api/base-api-service.js"></script>
    <script src="/frontend/api/auth/auth-api-service.js"></script>
    <script src="/frontend/api/dashboard/dashboard-api-service.js"></script>
    <script src="/frontend/utils/expression-utils.js"></script>
    <script src="/frontend/utils/graph-utils.js"></script>
    <script src="/frontend/components/graph-visualizer.js"></script>
    <script src="/frontend/transformer/gallery/gallery-transformer.js"></script>
    <script src="/frontend/ui/dashboard/dashboard-graph-controller.js"></script>
    <script src="/frontend/state/dashboard-state-manager.js"></script>
    <script src="/frontend/ui/nav/nav-controller.js"></script>
    <script src="/frontend/ui/dashboard/library-controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!authApiService.isAuthenticated()) {
                window.location.href = '/auth/login';
                return;
            }

            window.dashboardStateManager = new DashboardStateManager();
            window.dashboardGraphController = new DashboardGraphController(
                'preview-graph-container',
                {}                          // No callbacks for preview
            );
            window.libraryController = new LibraryController(dashboardStateManager, dashboardApiService);
            await libraryController.init();
        });

        function logout() {
            authApiService.logout();
            window.location.href = '/auth/login';
        }
    </script>
</body>
</html>
