<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Brotherhood - Public Gallery</title>
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/icon.png" />
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/frontend/css/gallery.css">
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <a href="/landing" class="header-back-link">&larr; Back to Home</a>
            <div class="header-title-section">
                <h1>Public Graph Gallery</h1>
                <div class="version-indicator">Read-Only Mode</div>
            </div>
        </div>
    </div>

    <div class="gallery-container">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <span>Public Graphs</span>
                <button id="refresh-graphs" class="sidebar-refresh-btn" title="Refresh list">↻</button>
            </div>
            <button class="toggle-sidebar-btn" title="Toggle Sidebar">☰</button>
            <div id="graph-list" class="sidebar-content">
                <p class="sidebar-loading">Loading...</p>
            </div>
        </div>

        <div class="main-area">
            <div id="graph-container"></div>
            
            <!-- Node Details Panel (Floating) -->
            <div id="node-details" class="node-details-panel">
                <span class="close-details">&times;</span>
                <h3 id="detail-title">Node Title</h3>
                <div id="detail-meta"></div>
                <div id="detail-desc"></div>

                <h4>Sources</h4>
                <div id="detail-sources" class="sources-container"></div>
            </div>

            <!-- Domain Details Panel (Floating) -->
            <div id="domain-details" class="node-details-panel">
                <span class="close-details" id="close-domain-details">&times;</span>
                <h3 id="domain-detail-title">Domain Title</h3>
                <div id="domain-detail-meta"></div>
                <div id="domain-detail-desc"></div>

                <h4>Nodes in Domain</h4>
                <div id="domain-detail-nodes" class="sources-container"></div>
            </div>
        </div>
    </div>

    <!-- Modern Architecture Dependencies -->
    <script src="/frontend/api/base-api-service.js"></script>
    <script src="/frontend/api/snapshots/snapshots-api-service.js"></script>
    <script src="/frontend/api/snapshots/gallery-api-service.js"></script>
    <script src="/frontend/utils/expression-utils.js"></script>
    <script src="/frontend/utils/graph-utils.js"></script>
    <script src="/frontend/transformer/gallery/gallery-transformer.js"></script>
    <script src="/frontend/state/gallery-state-manager.js"></script>
    <script src="/frontend/ui/gallery/gallery-controller.js"></script>
    <script src="/frontend/components/graph-visualizer.js"></script>
    
    <!-- Gallery Initialization -->
    <script>
        // Initialize gallery when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the modern gallery architecture
            const stateManager = galleryStateManager;
            const apiService = galleryApiService;
            const transformer = galleryTransformer;
            
            // Create unified gallery controller
            const galleryController = new GalleryController(stateManager, apiService, transformer);
        });
    </script>
</body>
</html>
