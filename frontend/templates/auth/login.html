<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Brotherhood Curator Lab</title>
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/icon.png" />
    <link rel="stylesheet" href="/frontend/css/common.css">
    <link rel="stylesheet" href="/frontend/css/lab_styles.css?v=8">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .login-header p {
            color: var(--secondary-color);
            margin: 0;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
        }
        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="/frontend/utils/theme.js" defer></script>
</head>
<body>
    <div class="card login-container">
        <div class="login-header">
            <h1>The Brotherhood</h1>
            <p>Curator Lab Login</p>
        </div>
        
        <div id="message-container"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" id="login-btn" class="btn btn-primary btn-full">Login</button>
        </form>
        
        <div class="signup-link">
            <p>Don't have an account? <a href="/auth/signup">Sign up here</a></p>
            <p><a href="/landing">← Back to Home</a></p>
        </div>
    </div>

    <!-- Load frontend architecture scripts -->
    <script src="/frontend/api/base-api-service.js"></script>
    <script src="/frontend/api/auth/auth-api-service.js"></script>
    <script src="/frontend/api/settings/settings-api-service.js"></script>
    <script src="/frontend/transformer/settings/settings-transformer.js"></script>
    <script src="/frontend/ui/dashboard/settings-controller.js"></script>
    <script src="/frontend/transformer/auth/auth-transformer.js"></script>

    <script>
        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const messageContainer = document.getElementById('message-container');
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            messageContainer.innerHTML = '';
            
            try {
                // Use the auth API service to login
                const authData = {
                    username: username,
                    password: password
                };
                
                const response = await authApiService.login(authData);
                
                // Store the token
                localStorage.setItem('access_token', response.access_token);

                // Sync the device's theme with the server's preference.
                // Fire-and-forget: per spec we never block login on a settings fetch failure
                // The Settings page does its own refresh and the user can always re-save.
                try {
                    await settingsController.loadAndSyncSettings();
                } catch (error) {
                    console.warn('Settings sync with server failed:', error);
                }

                // Show success message
                messageContainer.innerHTML = '<div class="success-message">Login successful! Redirecting...</div>';
                
                // Redirect to dashboard after a short delay
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
                
            } catch (error) {
                // Show error message
                messageContainer.innerHTML = `<div class="error-message">Login failed: ${error.message}</div>`;
                
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
