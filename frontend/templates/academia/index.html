<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia - The Brotherhood</title>
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/icon.png" />
    <link rel="stylesheet" href="/frontend/css/academia_styles.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div style="display: flex; align-items: center;">
                <div class="hamburger-menu">
                    <button class="hamburger-btn" onclick="openSidePanel()">☰</button>
                </div>
                <div style="margin-left: 30px;">
                    <h1 style="margin: 0;">Academia</h1>
                    <div class="version-indicator">Introduction</div>
                </div>
            </div>
        </div>

        <main class="dashboard-main">
            <div class="card">
                <h2>Welcome to Academia</h2>
                <p>
                    This section contains all your academic tools and resources. Browse public graphs, bookmark your favorite ones, learn at your own pace, and track your progress.
                </p>
            </div>
        </main>
    </div>

    <!-- Side Panel -->
    <div id="side-panel-overlay" class="side-panel-overlay"></div>
    <div id="side-panel" class="side-panel">
        <button class="side-panel-close" onclick="closeSidePanel()">&times;</button>
        <a href="/academia" class="side-panel-link active">Academia</a>
        <a href="/academia/library" class="side-panel-link">Library</a>
        <a href="/academia/assessment" class="side-panel-link">Self-Assessment</a>
        <a href="/dashboard" class="side-panel-link">Dashboard</a>
        <a href="/lab/workspace" class="side-panel-link">Workspace</a>
        <a href="/landing" class="side-panel-link">Home</a>
        <a href="#" onclick="logout()" class="side-panel-link" style="color: #d93025;">Logout</a>
    </div>

    <!-- Scripts -->
    <script src="/frontend/api/base-api-service.js"></script>
    <script src="/frontend/api/auth/auth-api-service.js"></script>
    <script src="/frontend/ui/nav/nav-controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!authApiService.isAuthenticated()) {
                window.location.href = '/auth/login';
                return;
            }
        });

        function logout() {
            authApiService.logout();
            window.location.href = '/auth/login';
        }
    </script>
</body>
</html>
